spring.application.name=pw2-6-descarte-sustentavel
# Conexão com Microsoft SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pw2_6_descarte_sustentavel;encrypt=true;trustServerCertificate=true
spring.datasource.username=joaoepedro
spring.datasource.password=*123456JP*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
# "validate" valida se o script DDL executado no SQL Server confere com as anotações Java
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect